apiVersion: apps/v1
kind: Deployment
metadata:
  name: exit143-broken
  labels:
    app: exit143-broken
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: exit143-broken
  template:
    metadata:
      labels:
        app: exit143-broken
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: sigterm-demo
        image: ubuntu:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          trap 'echo "Caught SIGTERM, terminating..."; exit 0' SIGTERM
          echo "Running normally... (try deleting the pod to send SIGTERM)"
          while true; do sleep 1; done
