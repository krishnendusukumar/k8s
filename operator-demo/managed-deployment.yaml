apiVersion: apps/v1
kind: Deployment
metadata:
  name: managed-app
  namespace: operator-demo
spec:
  selector:
    matchLabels:
      app: managed-app
  template:
    metadata:
      labels:
        app: managed-app
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: nginx
        image: nginx:alpine
