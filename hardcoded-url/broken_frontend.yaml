apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-broken
  labels:
    app: frontend-broken
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend-broken
  template:
    metadata:
      labels:
        app: frontend-broken
    spec:
      containers:
      - name: frontend
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            echo "Connecting to backend at http://backend:5678 ..."
            curl --max-time 3 http://backend:5678 || echo "ERROR: Connection failed"
            sleep 5
          done
        env:
        - name: BACKEND_URL
          value: "http://backend:5678"
