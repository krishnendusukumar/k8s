apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: victim
  template:
    metadata:
      labels:
        app: victim
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: victim-service
spec:
  selector:
    app: victim
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
